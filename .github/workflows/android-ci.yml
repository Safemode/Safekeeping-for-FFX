name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel an in-progress run when the same branch/PR gets a newer push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned rather than ubuntu-latest, so a runner image change is an edit made on purpose instead
    # of something that happens to the build unannounced.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # v5, not v6: v6 moved its caching into a closed-source component under Gradle's Terms of Use.
      # v5 already runs on Node 24, which is what the v4 upgrade was for.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      # Fails on lint errors only; warnings are reported but don't fail the build.
      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      # Builds the release variant so R8 shrinking (enabled in the release build type) is exercised
      # in CI - a bad or missing keep rule fails here rather than in a store build.
      - name: Assemble release
        run: ./gradlew assembleRelease --stacktrace
