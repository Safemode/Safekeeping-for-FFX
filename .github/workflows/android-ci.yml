name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel an in-progress run when the same branch/PR gets a newer push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      # Builds the release variant so R8 shrinking/obfuscation (enabled in the release build type)
      # is exercised in CI - a bad or missing keep rule fails here rather than in a store build.
      - name: Assemble release
        run: ./gradlew assembleRelease --stacktrace
